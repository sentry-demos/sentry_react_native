appId: ${APP_ID}
---
- launchApp
- assertVisible: "Empower Plant"
- tapOn:
    id: "landing-enter-button"
- waitForAnimationToEnd
# The demo backend's /products is slow (~12s) and intermittently returns 500,
# which leaves the list empty, so pull to refresh until the products load.
- extendedWaitUntil:
    visible: "Botana Voice"
    timeout: 30000
    optional: true
- repeat:
    while:
      notVisible: "Botana Voice"
    times: 5
    commands:
      - swipe:
          direction: DOWN
      - extendedWaitUntil:
          visible: "Botana Voice"
          timeout: 30000
          optional: true
- assertVisible: "Botana Voice"
- tapOn:
    text: "Add to cart"
    below:
      text: "Botana Voice"
    repeat: 3
- tapOn:
    text: "Add to cart"
    below:
      text: "Plant Mood"
- tapOn:
    id: "bottom-tab-cart"
- assertVisible: "CartScreen"
- scroll
- tapOn:
    text: "Delete"
    below:
      text: "Botana Voice"
- tapOn: "Checkout"
- tapOn: "email"
- hideKeyboard
- scrollUntilVisible:
    element: "Place your order"
- tapOn:
    text: "Place your order"
    repeat: 3
