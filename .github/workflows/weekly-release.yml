name: Weekly Release

# Creates a Sentry release + deploy every week (and on demand) without building
# the app. Commits are associated explicitly with the current HEAD so the job is
# independent of how often the repo actually changes.
on:
  schedule:
    # Mondays at 15:00 UTC
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Defaults to YY.MM.DD.'
        required: false
        default: ''

concurrency:
  group: weekly-release
  cancel-in-progress: false

env:
  SENTRY_ORG: demo
  SENTRY_PROJECT: mobile-react-native
  RELEASE_REPO: sentry-demos/sentry_react_native
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  sentry-release:
    name: Create Sentry release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(date -u +'%y.%m.%d')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Install sentry-cli
        run: npm install --global @sentry/cli

      - name: Check for an existing release
        id: guard
        run: |
          if sentry-cli releases info "${{ steps.version.outputs.version }}" \
            -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ steps.version.outputs.version }} already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and finalize release
        if: steps.guard.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sentry-cli releases new "$VERSION" -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"
          sentry-cli releases set-commits "$VERSION" \
            -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" \
            --commit "$RELEASE_REPO@$(git rev-parse HEAD)"
          sentry-cli releases finalize "$VERSION" -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"

      - name: Record deploy
        if: steps.guard.outputs.exists == 'false'
        run: |
          sentry-cli releases deploys new \
            --release "${{ steps.version.outputs.version }}" \
            -e production \
            -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"
