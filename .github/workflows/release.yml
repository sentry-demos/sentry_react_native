name: Release

# Weekly release train. Builds Android + iOS with one date-based version, publishes
# a GitHub release (TDA installs from `releases[0]`) and creates the matching Sentry
# release. The version is resolved once and flows to the native builds, the SDK
# runtime release, source maps, the GitHub tag and the Sentry release.
on:
  schedule:
    # Mondays at 15:00 UTC
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 25.10.01. Defaults to today (YY.MM.DD).'
        required: false
        default: ''
      version_code:
        description: 'Version code, e.g. 251001. Defaults to today (YYMMDD).'
        required: false
        default: ''
      ref:
        description: 'Branch to build from. Defaults to the selected branch.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

env:
  SENTRY_ORG: demo
  SENTRY_PROJECT: mobile-react-native
  RELEASE_REPO: sentry-demos/sentry_react_native
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve-version:
    name: 'Resolve version'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
      release: ${{ steps.v.outputs.release }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="${{ github.ref_name }}"; fi

          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="$(date -u +'%y.%m.%d')"; fi

          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="$(echo "$VERSION_NAME" | tr -cd '0-9')"
            if [ -z "$VERSION_CODE" ]; then VERSION_CODE="$(date -u +'%y%m%d')"; fi
          fi

          RELEASE="com.sentry_react_native@${VERSION_NAME}+${VERSION_CODE}"

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "release=$RELEASE"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE from $REF"

  build-android:
    name: 'Build Android'
    needs: [resolve-version]
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve-version.outputs.ref }}
      version_name: ${{ needs.resolve-version.outputs.version_name }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      release: ${{ needs.resolve-version.outputs.release }}

  build-ios:
    name: 'Build iOS'
    needs: [resolve-version]
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve-version.outputs.ref }}
      version_name: ${{ needs.resolve-version.outputs.version_name }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      release: ${{ needs.resolve-version.outputs.release }}

  publish-release:
    name: 'Publish Release'
    needs: [resolve-version, build-android, build-ios]
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VERSION_NAME: ${{ needs.resolve-version.outputs.version_name }}
      VERSION_CODE: ${{ needs.resolve-version.outputs.version_code }}
      RELEASE: ${{ needs.resolve-version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Download iOS App
        uses: actions/download-artifact@v4
        with:
          name: empower-plant-react-native-ios

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: empower-plant-react-native-android

      - name: Check for an existing GitHub release
        id: gh
        run: |
          if gh release view "$VERSION_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub release $VERSION_NAME already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.gh.outputs.exists == 'false'
        run: |
          gh release create "$VERSION_NAME" \
            app-release.apk \
            sentry_react_native.app.zip \
            --title "$VERSION_NAME" \
            --generate-notes

      - name: Install sentry-cli
        run: npm install --global @sentry/cli

      - name: Create Sentry release
        run: |
          # `releases new`/`finalize` are idempotent, and set-commits upserts, so
          # this is safe even if the build's source-map upload already created it.
          sentry-cli releases new "$RELEASE" -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"
          sentry-cli releases set-commits "$RELEASE" \
            -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" \
            --commit "$RELEASE_REPO@$(git rev-parse HEAD)"
          sentry-cli releases finalize "$RELEASE" -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"
          sentry-cli releases deploys new \
            --release "$RELEASE" -e production \
            -o "$SENTRY_ORG" -p "$SENTRY_PROJECT"
