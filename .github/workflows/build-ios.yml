name: iOS

on:
  workflow_call:
    inputs:
      ref:
        description: 'The branch to build from. E.g. main'
        required: false
        type: string
      se:
        description: 'Inlined into the JS bundle as EXPO_PUBLIC_SE. The TDA pipeline expects "tda".'
        required: false
        type: string
        default: tda
      version_name:
        description: 'Native versionName, e.g. 25.10.01. Baked into app.config.js and source maps.'
        required: false
        type: string
      version_code:
        description: 'Native buildNumber, e.g. 251001. Baked into app.config.js and source maps.'
        required: false
        type: string
      release:
        description: 'Sentry release name. Must match the runtime release set in Sentry.init.'
        required: false
        type: string

jobs:
  build-ios:
    name: iOS
    # Expo SDK 57 needs Xcode 26.4+ (Swift 6.3) to compile expo-modules-jsi, which
    # uses `weak let`. Older images fail with "'weak' must be a mutable variable".
    runs-on: macos-26
    env:
      APP_ARCHIVE_PATH: sentry_react_native.app.zip
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ALLOW_FAILURE: false
      # Read by app.config.js to stamp the native version (and thus the SDK release).
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      # Read by sentry-xcode.sh to upload source maps under the same release/dist as runtime.
      SENTRY_RELEASE: ${{ inputs.release }}
      SENTRY_DIST: ${{ inputs.version_code }}
      # babel-preset-expo inlines EXPO_PUBLIC_* at bundle time, so these have to be set for the build step, not just at runtime.
      EXPO_PUBLIC_SE: ${{ inputs.se }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.release }}
      EXPO_PUBLIC_SENTRY_DIST: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios

      # Workspace/scheme are named after app.config.js's "name" with non-alphanumeric
      # characters stripped (that's how `expo prebuild` derives them). Update these if
      # the app name in app.config.js ever changes.
      - name: Run xcodebuild
        working-directory: ios
        run: |
          mkdir -p "DerivedData"
          derivedData="$(cd "DerivedData" ; pwd -P)"
          set -o pipefail && xcodebuild \
            -workspace sentryreactnative.xcworkspace \
            -configuration "Release" \
            -scheme sentryreactnative \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derivedData" \
            build \
            | tee xcodebuild.log \
            | xcbeautify --quieter --is-ci --disable-colored-output

      - name: Archive App
        run: |
          cd ios/DerivedData/Build/Products/Release-iphonesimulator
          zip -r \
            ${{ github.workspace }}/${{ env.APP_ARCHIVE_PATH }} \
            sentryreactnative.app

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: empower-plant-react-native-ios
          path: ${{ env.APP_ARCHIVE_PATH }}
          retention-days: 60

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-logs
          path: ios/xcodebuild.log
