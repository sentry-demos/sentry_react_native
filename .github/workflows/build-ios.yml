name: iOS

on:
  workflow_call:
    inputs:
      ref:
        description: 'The branch to build from. E.g. main'
        required: false
        type: string

jobs:
  build-ios:
    name: iOS
    runs-on: macos-15
    env:
      APP_ARCHIVE_PATH: sentry_react_native.app.zip
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ALLOW_FAILURE: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios

      # Workspace/scheme are named after app.config.js's "name" with non-alphanumeric
      # characters stripped (that's how `expo prebuild` derives them). Update these if
      # the app name in app.config.js ever changes.
      - name: Run xcodebuild
        working-directory: ios
        run: |
          mkdir -p "DerivedData"
          derivedData="$(cd "DerivedData" ; pwd -P)"
          set -o pipefail && xcodebuild \
            -workspace sentryreactnative.xcworkspace \
            -configuration "Release" \
            -scheme sentryreactnative \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derivedData" \
            build \
            | tee xcodebuild.log \
            | xcbeautify --quieter --is-ci --disable-colored-output

      - name: Archive App
        run: |
          cd ios/DerivedData/Build/Products/Release-iphonesimulator
          zip -r \
            ${{ github.workspace }}/${{ env.APP_ARCHIVE_PATH }} \
            sentryreactnative.app

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: empower-plant-react-native-ios
          path: ${{ env.APP_ARCHIVE_PATH }}
          retention-days: 60

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-logs
          path: ios/xcodebuild.log
