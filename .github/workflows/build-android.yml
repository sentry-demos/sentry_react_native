name: Android

on:
  workflow_call:
    inputs:
      ref:
        description: 'The branch to build from. E.g. main'
        required: false
        type: string
      se:
        description: 'Inlined into the JS bundle as EXPO_PUBLIC_SE. The TDA pipeline expects "tda".'
        required: false
        type: string
        default: tda
      version_name:
        description: 'Native versionName, e.g. 25.10.01. Baked into app.config.js and source maps.'
        required: false
        type: string
      version_code:
        description: 'Native versionCode, e.g. 251001. Baked into app.config.js and source maps.'
        required: false
        type: string
      release:
        description: 'Sentry release name. Must match the runtime release set in Sentry.init.'
        required: false
        type: string

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    env:
      APK_PATH: android/app/build/outputs/apk/release/app-release.apk
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ALLOW_FAILURE: false
      # Read by app.config.js to stamp the native version (and thus the SDK release).
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      # Read by sentry.gradle to upload source maps under the same release/dist as runtime.
      SENTRY_RELEASE: ${{ inputs.release }}
      SENTRY_DIST: ${{ inputs.version_code }}
      # babel-preset-expo inlines EXPO_PUBLIC_* at bundle time, so these have to be set for the build step, not just at runtime.
      EXPO_PUBLIC_SE: ${{ inputs.se }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.release }}
      EXPO_PUBLIC_SENTRY_DIST: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - uses: gradle/gradle-build-action@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: empower-plant-react-native-android
          path: ${{ env.APK_PATH }}
          retention-days: 60
